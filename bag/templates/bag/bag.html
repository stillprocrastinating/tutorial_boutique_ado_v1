{% extends "base.html" %}
{% load static %}


{% block page_header %}

<div class="container header-container">
    <div class="row">
        <div class="col"></div>
    </div>
</div>

{% endblock page_header %}


{% block content %}

<div class="overlay"></div>
<div class="container mb-2">
    <div class="row">
        <div class="col">
            <hr>
            <h2 class="logo-font mb-4">
                Shopping bag
            </h2>
            <hr>
        </div>
    </div>
    <div class="row">
        <div class="col">
            {% if bag_items %}
                <div class="rounded table-responsive"></div>
            {% else %}
                <p class="lead mb-5">
                    Your bag is empty.
                </p>
                <a class="btn btn-lg btn-outline-black rounded-0" href="{% url 'products' %}">
                    <span class="icon">
                        <i class="fa-chevron-left fas noi">
                            &#171;
                        </i>
                    </span>
                    <span class="text-uppercase">
                        Keep shopping
                    </span>
                </a>
            {% endif %}
        </div>
    </div>
</div>

{% endblock content %}
