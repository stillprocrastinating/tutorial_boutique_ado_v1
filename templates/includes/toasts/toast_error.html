<div class="border-top-0 custom-toast rounded-0 toast" data-autohide="false">
    <div class="arrow-danger arrow-up"></div>
    <div class="bg-danger toast-capper w-100"></div>
    <div class="bg-white text-dark toast-header">
        <strong class="mr-auto">
            Error!
        </strong>
        <button aria-label="Close" class="close mb-1 ml-2 text-dark" data-dismiss="toast" type="button">
            <span aria-hidden="true">
                &times;
            </span>
        </button>
        <div class="bg-white toast-body">
            {{ message }}
        </div>
    </div>
</div>
