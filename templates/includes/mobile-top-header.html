<li class="list-inline-item">
    <a aria-expanded="false" aria-haspopup="true" class="d-block d-lg-none nav-link text-block" data-toggle="dropdown" href="#" id="mobile-search">
        <div class="text-center">
            <div>
                <i class="fa-lg fa-search fas"></i>
            </div>
            <p class="my-0">
                Search
            </p>
        </div>
    </a>
    <div class="border-0 dropdown-menu my-0 rounded-0 p-3 w-100">
        <form action="" class="form" method="GET">
            <div class="input-group w-100">
                <input class="border border-black form-control rounded-0" name="q" placeholder="Search our site" type="text">
                <div class="input-group-append">
                    <button class="border border-black btn btn-black form-control rounded-0" type="submit">
                        <span class="icon">
                            <i class="fa-search fas"></i>
                        </span>
                    </button>
                </div>
            </div>
        </form>
    </div>
</li>
<li class="dropdown list-inline-item">
    <a aria-expanded="false" aria-haspopup="true" class="d-block d-lg-none nav-link text-black" data-toggle="dropdown" href="#" id="user-options">
        <div class="text-center">
            <div>
                <i class="fa-lg fa user fas"></i>
            </div>
            <p class="my-0">
                My account
            </p>
        </div>
    </a>
    <div aria-labelledby="user-options" class="border-0 dropdown-menu">
        {% if request.user.is_authenticated %}
            {% if request.user.is_superuser %}
                <a class="dropdown-item" href="{% url 'account_logout' %}">
                    Product management
                </a>
            {% endif %}
            <!-- <a class="dropdown-item" href="dj url 'profile' dj"> -->
            <a class="dropdown-item" href="">
                My profile
            </a>
            <a class="dropdown-item" href="{% url 'account_logout' %}">
                Logout
            </a>
        {% else %}
            <a class="dropdown-item" href="{% url 'account_signup' %}">
                Signup
            </a>
            <a class="dropdown-item" href="{% url 'account_login' %}">
                Login
            </a>
        {% endif %}
    </div>
</li>
<li class="list-inline-item">
    <a class="{% if grand_total %} font-weight-bold text-primary {% else %} text-black {% endif %} d-block d-lg-none nav-link" href="">
        <div class="text-center">
            <div>
                <i class="fa-lg fa-shopping-bag fas"></i>
            </div>
            <p class="my-0">
                {% if grand_total %}
                    £{{ grand_total|floatformat:2 }}
                {% else %}
                    £0.00
                {% endif %}
            </p>
        </div>
    </a>
</li>
